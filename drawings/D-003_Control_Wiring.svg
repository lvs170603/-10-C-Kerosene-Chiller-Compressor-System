<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F4E79; }
      .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; fill: #555555; }
      .box { fill: #F8FAFC; stroke: #1F4E79; stroke-width: 2; rx: 6; }
      .box-plc { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; rx: 6; }
      .box-trip { fill: #FEF2F2; stroke: #DC2626; stroke-width: 2; rx: 6; }
      .wire-r { stroke: #DC2626; stroke-width: 2.5; fill: none; }
      .wire-y { stroke: #CA8A04; stroke-width: 2.5; fill: none; }
      .wire-b { stroke: #2563EB; stroke-width: 2.5; fill: none; }
      .wire-ctrl { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #1E293B; }
      .text-bold { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0F172A; }
      .text-tag { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0369A1; }
    </style>
  </defs>
  <!-- Border and Title Block -->
  <rect x="10" y="10" width="930" height="400" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" rx="8"/>
  <rect x="25" y="25" width="900" height="60" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" rx="4"/>
  <text x="40" y="52" class="title">D-003: 24V DC & 230V AC CONTROL CIRCUIT SCHEMATIC</text>
  <text x="40" y="72" class="subtitle">-10°C KEROSENE CHILLER | R I INDUSTRIES | DWG REV 1.0</text>
  
  <rect x="50" y="110" width="220" height="120" class="box"/>
  <text x="70" y="140" class="text-bold">24V DC POWER SOURCE</text>
  <text x="70" y="165" class="text">SMPS 120W (24V 5A)</text>
  <text x="70" y="185" class="text">Positive Bus: [+24V DC]</text>
  <text x="70" y="205" class="text">Negative Bus: [0V DC]</text>

  <rect x="330" y="110" width="280" height="260" class="box"/>
  <text x="350" y="140" class="text-bold">DIGITAL INPUTS LOOP (+24V)</text>
  <text x="350" y="165" class="text">+24V Bus -> Field Contacts -> PLC DI</text>
  <text x="350" y="195" class="text">• X9: LP 1 Switch NC Contact</text>
  <text x="350" y="215" class="text">• X10: HP 1 Switch NC Contact</text>
  <text x="350" y="235" class="text">• X11: MDL 1 Thermistor Module Contact</text>
  <text x="350" y="255" class="text">• X12: OLL 1 Minilec MPR D2 Contact</text>
  <text x="350" y="275" class="text">• X17: Kerosene Flow Switch Contact</text>
  <text x="350" y="300" class="text">• X0: Minilec D2 VMR2 Phase Contact</text>
  <text x="350" y="325" class="text">• X3: Primary Pump LRD12 Contact</text>

  <rect x="650" y="110" width="250" height="260" class="box"/>
  <text x="670" y="140" class="text-bold">OUTPUT DRIVES LOOP</text>
  <text x="670" y="165" class="text">PLC Relay -> Interposing / Coils</text>
  <text x="670" y="195" class="text">• NO-00 -> Primary Pump Contactor (230V)</text>
  <text x="670" y="215" class="text">• NO-01 -> Secondary Pump Contactor (230V)</text>
  <text x="670" y="235" class="text">• NO-02 -> Condenser Fan Contactor (230V)</text>
  <text x="670" y="255" class="text">• NO-03 -> Comp 1 Primary KM-01 (24V)</text>
  <text x="670" y="275" class="text">• NO-04 -> Comp 1 Secondary KM-02 (24V)</text>
  <text x="670" y="295" class="text">• NO-08, 09 -> SOV 1 &amp; SOV 2 (230V)</text>
  <text x="670" y="320" class="text">• R1..R4 -> Panel Lamps &amp; Buzzer (230V)</text>

</svg>
