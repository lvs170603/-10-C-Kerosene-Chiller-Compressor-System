<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F4E79; }
      .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; fill: #555555; }
      .box { fill: #F8FAFC; stroke: #1F4E79; stroke-width: 2; rx: 6; }
      .box-plc { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; rx: 6; }
      .box-trip { fill: #FEF2F2; stroke: #DC2626; stroke-width: 2; rx: 6; }
      .wire-r { stroke: #DC2626; stroke-width: 2.5; fill: none; }
      .wire-y { stroke: #CA8A04; stroke-width: 2.5; fill: none; }
      .wire-b { stroke: #2563EB; stroke-width: 2.5; fill: none; }
      .wire-ctrl { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #1E293B; }
      .text-bold { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0F172A; }
      .text-tag { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0369A1; }
    </style>
  </defs>
  <!-- Border and Title Block -->
  <rect x="10" y="10" width="930" height="400" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" rx="8"/>
  <rect x="25" y="25" width="900" height="60" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" rx="4"/>
  <text x="40" y="52" class="title">D-002: SELEC MiBRX PLC SYSTEM & MODULE ARCHITECTURE</text>
  <text x="40" y="72" class="subtitle">-10°C KEROSENE CHILLER | R I INDUSTRIES | DWG REV 1.0</text>
  
  <!-- Selec MiBRX Modular PLC Rack -->
  <rect x="50" y="110" width="850" height="260" class="box-plc"/>
  <text x="70" y="140" class="text-bold" font-size="16">SELEC MiBRX MODULAR MICRO PLC ARCHITECTURE</text>
  <text x="70" y="160" class="text">Base Unit: LCD + Keypad [F1, F2, F3, F4, SET, Enter] | Supply: 24V DC</text>

  <!-- Slots -->
  <rect x="70" y="180" width="120" height="160" class="box"/>
  <text x="80" y="205" class="text-bold">SLOT 1: AI (RTD)</text>
  <text x="80" y="225" class="text">RTD1-0 (Outlet +)</text>
  <text x="80" y="245" class="text">RTD2-0 (Outlet -)</text>
  <text x="80" y="265" class="text">RTD3-0 (Comp)</text>
  <text x="80" y="295" class="text">RTD1-1 (Inlet +)</text>
  <text x="80" y="315" class="text">RTD2-1, 3-1</text>

  <rect x="210" y="180" width="160" height="160" class="box"/>
  <text x="220" y="205" class="text-bold">SLOT 2: DI (Safety)</text>
  <text x="220" y="225" class="text">X9(LP1), X10(HP1)</text>
  <text x="220" y="245" class="text">X11(MDL1), X12(OLL1)</text>
  <text x="220" y="265" class="text">X13(LP2), X14(HP2)</text>
  <text x="220" y="285" class="text">X15(MDL2), X16(OLL2)</text>
  <text x="220" y="305" class="text">X17(Flow Switch)</text>

  <rect x="390" y="180" width="140" height="160" class="box"/>
  <text x="400" y="205" class="text-bold">SLOT 3: DI / Power</text>
  <text x="400" y="225" class="text">Terminal 1 (24V+)</text>
  <text x="400" y="245" class="text">Terminal N (0V)</text>
  <text x="400" y="265" class="text">X0 (VMR Relay)</text>
  <text x="400" y="285" class="text">X1, X2 (Pump FBKs)</text>
  <text x="400" y="305" class="text">X4, X5 (Comp FBKs)</text>

  <rect x="550" y="180" width="160" height="160" class="box"/>
  <text x="560" y="205" class="text-bold">SLOT 4 &amp; 5: DO</text>
  <text x="560" y="225" class="text">NO-00 (Primary Pump)</text>
  <text x="560" y="245" class="text">NO-01 (Secondary Pump)</text>
  <text x="560" y="265" class="text">NO-02 (Condenser Fan)</text>
  <text x="560" y="285" class="text">NO-03 (Comp 1 Pri)</text>
  <text x="560" y="305" class="text">NO-04 (Comp 1 Sec)</text>

  <rect x="730" y="180" width="150" height="160" class="box"/>
  <text x="740" y="205" class="text-bold">SLOT 6: DO / Lamps</text>
  <text x="740" y="225" class="text">NO-05 (Comp 2 Pri)</text>
  <text x="740" y="245" class="text">NO-06 (Comp 2 Sec)</text>
  <text x="740" y="265" class="text">NO-08, 09 (SOV 1, 2)</text>
  <text x="740" y="285" class="text">RED, YEL, GRN Lamps</text>
  <text x="740" y="305" class="text">BUZZER (Common N)</text>

</svg>
