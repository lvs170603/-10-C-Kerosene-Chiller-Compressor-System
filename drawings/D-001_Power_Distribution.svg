<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F4E79; }
      .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; fill: #555555; }
      .box { fill: #F8FAFC; stroke: #1F4E79; stroke-width: 2; rx: 6; }
      .box-plc { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; rx: 6; }
      .box-trip { fill: #FEF2F2; stroke: #DC2626; stroke-width: 2; rx: 6; }
      .wire-r { stroke: #DC2626; stroke-width: 2.5; fill: none; }
      .wire-y { stroke: #CA8A04; stroke-width: 2.5; fill: none; }
      .wire-b { stroke: #2563EB; stroke-width: 2.5; fill: none; }
      .wire-ctrl { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #1E293B; }
      .text-bold { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0F172A; }
      .text-tag { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0369A1; }
    </style>
  </defs>
  <!-- Border and Title Block -->
  <rect x="10" y="10" width="930" height="400" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" rx="8"/>
  <rect x="25" y="25" width="900" height="60" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" rx="4"/>
  <text x="40" y="52" class="title">D-001: 415V 3-PHASE POWER DISTRIBUTION SCHEMATIC</text>
  <text x="40" y="72" class="subtitle">-10°C KEROSENE CHILLER | R I INDUSTRIES | DWG REV 1.0</text>
  
  <!-- Main Incomer -->
  <rect x="50" y="120" width="160" height="80" class="box"/>
  <text x="70" y="150" class="text-bold">415V AC INCOMER</text>
  <text x="70" y="170" class="text">Schneider EasyPact MCCB</text>
  <text x="70" y="185" class="text-tag">[MCCB-01]</text>

  <!-- Busbars -->
  <line x1="210" y1="140" x2="850" y2="140" class="wire-r"/>
  <line x1="210" y1="160" x2="850" y2="160" class="wire-y"/>
  <line x1="210" y1="180" x2="850" y2="180" class="wire-b"/>
  <text x="860" y="145" class="text-bold" fill="#DC2626">R (L1)</text>
  <text x="860" y="165" class="text-bold" fill="#CA8A04">Y (L2)</text>
  <text x="860" y="185" class="text-bold" fill="#2563EB">B (L3)</text>

  <!-- Branches -->
  <!-- Comp 1 -->
  <rect x="250" y="240" width="130" height="100" class="box"/>
  <text x="260" y="265" class="text-bold">COMP 1 STARTER</text>
  <text x="260" y="285" class="text">2x LC1D40A (PW)</text>
  <text x="260" y="305" class="text">Minilec CT (32-80A)</text>
  <text x="260" y="325" class="text-tag">[KM-01, KM-02]</text>

  <!-- Comp 2 -->
  <rect x="410" y="240" width="130" height="100" class="box"/>
  <text x="420" y="265" class="text-bold">COMP 2 STARTER</text>
  <text x="420" y="285" class="text">2x LC1D40A (PW)</text>
  <text x="420" y="305" class="text">Minilec CT (32-80A)</text>
  <text x="420" y="325" class="text-tag">[KM-03, KM-04]</text>

  <!-- Pumps -->
  <rect x="570" y="240" width="130" height="100" class="box"/>
  <text x="580" y="265" class="text-bold">PUMPS STARTERS</text>
  <text x="580" y="285" class="text">LC1D12 + LRD12</text>
  <text x="580" y="305" class="text">Primary &amp; Secondary</text>
  <text x="580" y="325" class="text-tag">[KM-05, KM-06]</text>

  <!-- Fan & SMPS -->
  <rect x="730" y="240" width="130" height="100" class="box"/>
  <text x="740" y="265" class="text-bold">FAN &amp; 24V SMPS</text>
  <text x="740" y="285" class="text">Fan: LC1D09</text>
  <text x="740" y="305" class="text">SMPS: 24V 5A (120W)</text>
  <text x="740" y="325" class="text-tag">[KM-07, PSU-01]</text>

</svg>
